# ──────────────────────────────────────────────────────────────
# GENERAL
# ──────────────────────────────────────────────────────────────

general {
    hide_cursor = true
    disable_loading_bar = true
    ignore_empty_input = false
    immediate_render = true
}


# ──────────────────────────────────────────────────────────────
# BACKGROUND
# ──────────────────────────────────────────────────────────────

background {
    monitor =
    path = /mnt/Fear/1.fondos/que locura espacial es esta.png

    blur_passes = 1
    blur_size = 3

    noise = 0.015
    contrast = 1.0
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}


# ──────────────────────────────────────────────────────────────
# CLOCK
# ──────────────────────────────────────────────────────────────

label {
    monitor =

    text = $TIME

    font_family = Arial
    font_size = 96

    color = rgb(e8e6ff)

    position = 0, 150

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────────
# DATE
# ──────────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] echo "$(date '+%A, %d de %B')"

    font_family = Arial
    font_size = 20

    color = rgb(a9a4d6)

    position = 0, 78

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────────
# USER
# ──────────────────────────────────────────────────────────────

label {
    monitor =

    text = ✦  carlosjgo

    font_family = Arial
    font_size = 17

    color = rgb(c7c3f5)

    position = 0, -70

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────────
# PASSWORD FIELD
# ──────────────────────────────────────────────────────────────

input-field {
    monitor =

    size = 380, 64

    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.16
    dots_center = true

    outer_color = rgb(8b5cf6)
    inner_color = rgba(8, 10, 25, 0.82)
    font_color = rgb(f2f0ff)

    font_family = Arial

    fade_on_empty = false

    placeholder_text = <i>Enter password</i>

    hide_input = false

    rounding = 16

    check_color = rgb(8b5cf6)
    fail_color = rgb(ff4f9a)

    fail_text = <i>$FAIL  ($ATTEMPTS)</i>

    capslock_color = rgb(ca8cff)

    position = 0, -155

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────────
# STATUS
# ──────────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo "SYSTEM LOCKED  •  $(date '+%H:%M')"

    font_family = Arial
    font_size = 12

    color = rgb(706b94)

    position = 0, -245

    halign = center
    valign = center
}


# ──────────────────────────────────────────────────────────────
# JUGOO
# ──────────────────────────────────────────────────────────────

label {
    monitor =

    text = ✦  JUGOO

    font_family = Arial
    font_size = 15

    color = rgb(9f7aea)

    position = 45, -35

    halign = left
    valign = top
}


# ──────────────────────────────────────────────────────────────
# SPACE
# ──────────────────────────────────────────────────────────────

label {
    monitor =

    text = SPACE // SECURE

    font_family = Arial
    font_size = 11

    color = rgb(69638c)

    position = -45, -38

    halign = right
    valign = top
}


# ──────────────────────────────────────────────────────────────
# BOTTOM
# ──────────────────────────────────────────────────────────────

label {
    monitor =

    text = ✦  Session secured

    font_family = Arial
    font_size = 12

    color = rgb(656080)

    position = 0, 35

    halign = center
    valign = bottom
}
