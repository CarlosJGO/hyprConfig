general {
    lock_cmd = pidof hyprlock || /home/carlosjgo/.local/bin/hyprlock-random-bg
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = /home/carlosjgo/.local/bin/hyprlock-random-bg
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
